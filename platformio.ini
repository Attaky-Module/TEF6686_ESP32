; PlatformIO configuration for TEF6686_ESP32.
; Upstream v2.20 ships as an Arduino IDE sketch with no platformio.ini; this
; file is added by the Attaky port. The .ino stays in the repository root so
; the Arduino IDE flow keeps working.

[platformio]
; The sketch lives in the root, not in src/ (src/ holds the upstream modules).
src_dir = .

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Compile the root .ino plus src/, and nothing else.
build_src_filter =
    +<*>
    -<.git/>
    -<.github/>
    -<data/>
    -<docs/>
    -<build/>
    -<.pio/>
    -<.vscode/>
    -<lib/>

; Upstream external dependencies for v2.20 (see the includes at the head of
; TEF6686_ESP32.ino): TimeLib, ESP32Time and Hash_tng (sha1 in comms.cpp).
; TFT_eSPI is NOT a registry dependency: lib/TFT_eSPI carries the exact
; stock Bodmer v2.5.43 copy the delivered FM/AM 2.20-A001 build rendered
; with (kept in shot-build/lib/TFT_eSPI, SHOT_MODE pushImage patch reverted)
; — pinned so library drift can never change panel rendering.
lib_deps =
    paulstoffregen/Time
    fbiego/ESP32Time
    https://github.com/bbx10/Hash_tng.git

; ---------------------------------------------------------------------------
; Attaky ATK_COMBO_V1 board profile: Core_ESP32_1.0 + Expand_FM-AM-Radio_1.0
; (optional Power_Standard-Cell). ESP32-S3, 16 MB flash, octal PSRAM present
; but deliberately unused (see the PSRAM note below).
;
; The board/TFT settings replicate 1:1 the HW-verified recipe that produced the
; delivered FM/AM 2.20-A001 build from this same upstream v2.20 source:
; espressif32@6.13.0 / arduino 2.0.17, dio flash
; at 80 MHz, ARDUINO_USB_MODE=1, USE_HSPI_PORT, TFT_MISO=13 with NO TFT_MOSI
; (single-wire SDA read), TFT_SDA_READ, BGR colour order. Every deviation from
; that recipe tried so far turned out to be a bug.
; ---------------------------------------------------------------------------
[env:atk_combo_v1]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_atk16mb.csv
; The app partition is `factory` at 0x20000 (see partitions_atk16mb.csv); without
; this the platform's 0x10000 default writes the image outside it and the board
; boot-loops.
board_upload.offset_address = 0x20000
board_build.filesystem = spiffs
build_flags =
    ; Strip the build host's absolute paths from __FILE__ (the .bin ships on a
    ; public store; PlatformIO/Arduino otherwise bakes /Users/<user>/... in).
    -ffile-prefix-map=${sysenv.HOME}=.
    ; PSRAM is deliberately NOT enabled. With -DBOARD_HAS_PSRAM the default
    ; heap serves sprites / Strings / FreeRTOS queues from octal PSRAM and the
    ; upstream menu drawing path corrupts PSRAM heap objects (UART event queue,
    ; heap spinlocks) -> silent rst:0xc reboots and hangs. Upstream runs this
    ; same code on a PSRAM-less classic ESP32 and the peak footprint (~135 KB)
    ; fits the S3's 320 KB internal RAM. Re-enable only with a root-caused
    ; overflow fix in hand.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DATK_COMBO_V1=1
    ; The menu-open call chain (doTouchEvent -> DoMenu -> BuildMenu ->
    ; ShowOneLine -> sprite drawString smooth-font rendering) overflows the
    ; default 8 KB arduino loopTask stack. The overflow tramples heap-allocated
    ; sprite data while leaving block headers intact, so heap integrity checks
    ; still pass and the corrupted sprite pointer later hangs loop() or asserts
    ; in a spinlock. 32 KB sized from measured stack high-water marks.
    -DARDUINO_LOOP_STACK_SIZE=32768
    ; --- TFT_eSPI User_Setup, replicating the delivered 2.20-A001 build ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_SDA_READ=1
    -DTFT_RGB_ORDER=0x0
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_SCLK=11
    -DTFT_CS=45
    -DTFT_DC=12
    -DTFT_RST=10
    -DTFT_BL=14
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DUSE_HSPI_PORT=1
